<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="
    width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no
  " />
  <title>Portal do Fornecedor • Mercatto</title>
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#020617">

  <link rel="apple-touch-icon" href="logo-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =====================================================
ROOT
===================================================== */

    :root {

      --bg: #f3f6fb;
      --card: #ffffff;
      --line: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #020617;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #ca8a04;
      --blue: #2563eb;

    }

    /* =====================================================
BASE
===================================================== */

    * {

      margin: 0;
      padding: 0;

      box-sizing: border-box;

      font-family: Inter, sans-serif;

    }

    html {

      scroll-behavior: smooth;

    }

    body {

      background: var(--bg);

      color: var(--text);

      -webkit-font-smoothing: antialiased;

      text-rendering: optimizeLegibility;

    }

    /* =====================================================
LOGIN
===================================================== */

    .login {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 24px;

      background:
        linear-gradient(135deg,
          #020617,
          #0f172a,
          #1e293b);

      position: relative;

      overflow: hidden;

    }

    .login::before {

      content: '';

      position: absolute;

      width: 700px;
      height: 700px;

      border-radius: 50%;

      background:
        radial-gradient(circle,
          rgba(255, 255, 255, .06),
          transparent 70%);

      top: -320px;
      right: -200px;

    }

    .login-card {

      width: 100%;
      max-width: 420px;

      background:
        rgba(255, 255, 255, .96);

      backdrop-filter: blur(14px);

      border-radius: 28px;

      padding: 30px 24px;

      position: relative;

      z-index: 2;

      box-shadow:
        0 30px 70px rgba(0, 0, 0, .25);

    }

    .logo {

      width: 74px;
      height: 74px;

      border-radius: 22px;

      background:
        linear-gradient(135deg,
          #020617,
          #334155);

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 20px;

    }

    .logo img {

      width: 46px;

      object-fit: contain;

    }

    .login-card h1 {

      font-size: 28px;

      font-weight: 900;

      color: #020617;

      margin-bottom: 8px;

    }

    .login-card p {

      font-size: 13px;

      color: #64748b;

      margin-bottom: 22px;

      line-height: 1.5;

    }

    .login-card input {

      width: 100%;

      height: 54px;

      border: none;

      border-radius: 16px;

      background: #f1f5f9;

      padding: 0 16px;

      outline: none;

      margin-bottom: 12px;

      font-size: 13px;

      font-weight: 600;

    }

    .login-card input:focus {

      background: white;

      box-shadow:
        0 0 0 4px rgba(37, 99, 235, .08);

    }

    .login-card button {

      width: 100%;

      height: 56px;

      border: none;

      border-radius: 16px;

      background:
        linear-gradient(135deg,
          #020617,
          #1e293b);

      color: white;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;

    }

    /* =====================================================
APP
===================================================== */

    .app {
      display: none;
    }

    /* =====================================================
TOP
===================================================== */

    .top {

      position: sticky;

      top: 0;

      z-index: 999;

      background: white;

      border-bottom: 1px solid var(--line);

    }

    .top-flex {

      padding: 12px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

    }

    .top h1 {

      font-size: 18px;

      font-weight: 900;

      color: #020617;

      margin-bottom: 2px;

    }

    .top small {

      font-size: 11px;

      color: #64748b;

    }

    /* =====================================================
TOP ACTIONS
===================================================== */

    .top-actions {

      display: flex;

      align-items: center;

      gap: 6px;

    }

    /* =====================================================
BUTTONS
===================================================== */

    .btn {

      height: 34px;

      padding: 0 12px;

      border: none;

      border-radius: 10px;

      background: #020617;

      color: white;

      font-size: 11px;

      font-weight: 800;

      cursor: pointer;

      transition: .15s;

    }

    .btn:hover {

      opacity: .92;

    }

    .btn-red {

      background: #dc2626;

    }

    .btn-light {

      background: #f1f5f9;

      color: #020617;

    }

    /* =====================================================
CONTAINER
===================================================== */

    .container {

      padding: 10px;

      display: flex;

      flex-direction: column;

      gap: 10px;

    }

    /* =====================================================
CARD
===================================================== */

    .card {

      background: white;

      border-radius: 18px;

      border: 1px solid var(--line);

      overflow: hidden;

    }

    /* =====================================================
CARD TOP
===================================================== */

    .card-top {

      padding: 12px 14px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      border-bottom: 1px solid var(--line);

    }

    .card-top h2 {

      font-size: 15px;

      font-weight: 900;

      color: #020617;

      margin-bottom: 3px;

    }

    .card-top small {

      font-size: 11px;

      color: #64748b;

    }

    /* =====================================================
STATUS
===================================================== */

    .status {

      padding: 5px 10px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: 900;

      text-transform: uppercase;

    }

    .ativa {

      background: #dcfce7;

      color: #166534;

    }

    .respondida {

      background: #fef3c7;

      color: #92400e;

    }

    .finalizada {

      background: #fee2e2;

      color: #991b1b;

    }

    /* =====================================================
LISTA
===================================================== */

    .cotacao-lista {

      display: flex;

      flex-direction: column;

    }

    /* =====================================================
ITEM
===================================================== */

    .item-cotacao {

      padding: 14px;

      border-bottom: 1px solid #edf2f7;

      background: white;

    }

    .item-cotacao:last-child {

      border-bottom: none;

    }

    /* =====================================================
TOPO ITEM
===================================================== */

    .linha-topo {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 10px;

    }

    .produto {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 6px;

      font-size: 14px;

      font-weight: 800;

      color: #020617;

    }

    .meta {

      font-size: 11px;

      font-weight: 700;

      color: #64748b;

      white-space: nowrap;

    }

    /* =====================================================
INPUTS
===================================================== */

    .linha-inputs {

      display: grid;

      grid-template-columns:
        100px 1fr;

      gap: 8px;

    }

    .linha-inputs input {

      width: 100%;

      height: 38px;

      border: none;

      border-radius: 12px;

      background: #f1f5f9;

      padding: 0 12px;

      font-size: 12px;

      font-weight: 700;

      outline: none;

      color: #020617;

    }

    .linha-inputs input::placeholder {

      color: #94a3b8;

    }

    .linha-inputs input:focus {

      background: white;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, .08);

    }

    .money {

      text-align: right;

    }

    .readonly {

      opacity: .7;

      cursor: not-allowed;

    }

    /* =====================================================
ACTIONS
===================================================== */

    .actions {

      padding: 12px 14px;

      display: flex;

      justify-content: flex-end;

      gap: 8px;

      border-top: 1px solid var(--line);

    }

    /* =====================================================
EMPTY
===================================================== */

    .empty {

      background: white;

      border-radius: 18px;

      border: 1px solid var(--line);

      padding: 70px 20px;

      text-align: center;

      font-size: 14px;

      font-weight: 700;

      color: #64748b;

    }

    /* =====================================================
OVERLAY
===================================================== */

    .overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(255, 255, 255, .55);

      backdrop-filter: blur(5px);

      display: none;

      justify-content: center;

      align-items: center;

      z-index: 9999;

    }

    .overlay::after {

      content: '';

      width: 68px;
      height: 68px;

      border-radius: 50%;

      border: 5px solid #dbe3ec;

      border-top-color: #020617;

      animation: spin .8s linear infinite;

    }

    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

    /* =====================================================
RESPONSIVO
===================================================== */

    @media(max-width:700px) {

      .top-flex {

        padding: 10px;

      }

      .top h1 {

        font-size: 16px;

      }

      .linha-inputs {

        grid-template-columns:
          90px 1fr;

      }

      .btn {

        height: 32px;

        padding: 0 10px;

        font-size: 10px;

      }

    }

    /* =====================================================
SPLASH
===================================================== */

    #splash {

      position: fixed;

      inset: 0;

      background:
        linear-gradient(135deg,
          #020617,
          #071226,
          #0f172a);

      z-index: 999999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      transition: 1s;

    }

    .splash-bg {

      position: absolute;

      width: 900px;
      height: 900px;

      border-radius: 50%;

      background:
        radial-gradient(circle,
          rgba(37, 99, 235, .18),
          transparent 70%);

      animation:
        rotateBg 10s linear infinite;

    }

    @keyframes rotateBg {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    .pulse {

      position: absolute;

      width: 260px;
      height: 260px;

      border-radius: 50%;

      border: 2px solid rgba(37, 99, 235, .2);

      animation:
        pulseAnim 2s infinite;

    }

    @keyframes pulseAnim {

      0% {

        transform: scale(.8);
        opacity: 0;

      }

      50% {

        opacity: 1;

      }

      100% {

        transform: scale(1.4);
        opacity: 0;

      }

    }

    .cart-loader {

      width: 120px;
      height: 120px;

      border-radius: 32px;

      border: 3px solid rgba(37, 99, 235, .35);

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      backdrop-filter: blur(10px);

      background:
        rgba(255, 255, 255, .03);

      box-shadow:
        0 20px 60px rgba(37, 99, 235, .2);

      z-index: 2;

    }

    .cart-line {

      width: 52px;
      height: 8px;

      border-radius: 20px;

      background:
        linear-gradient(90deg,
          #2563eb,
          #60a5fa);

      margin: 6px 0;

      animation:
        lineMove 1s infinite;

    }

    .delay {
      animation-delay: .15s;
    }

    .delay2 {
      animation-delay: .3s;
    }

    @keyframes lineMove {

      0% {

        transform: translateX(-18px);
        opacity: .2;

      }

      50% {

        transform: translateX(18px);
        opacity: 1;

      }

      100% {

        transform: translateX(-18px);
        opacity: .2;

      }

    }

    #splash h1 {

      margin-top: 24px;

      font-size: 28px;

      font-weight: 900;

      color: white;

      letter-spacing: -1px;

    }


    /* =====================================================
MENOR PREÇO DOS OUTROS FORNECEDORES
===================================================== */

    .menor-preco-box {

      margin-top: 10px;

      border-radius: 14px;

      padding: 10px 12px;

      border: 1px solid #dbeafe;

      background:
        linear-gradient(135deg,
          #eff6ff,
          #ffffff);

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

    }

    .menor-preco-info {

      display: flex;

      flex-direction: column;

      gap: 3px;

      min-width: 0;

    }

    .menor-preco-label {

      font-size: 10px;

      font-weight: 900;

      color: #2563eb;

      text-transform: uppercase;

      letter-spacing: .3px;

    }

    .menor-preco-fornecedor {

      font-size: 13px;

      font-weight: 900;

      color: #020617;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }

    .menor-preco-valor {

      font-size: 16px;

      font-weight: 1000;

      color: #16a34a;

      white-space: nowrap;

    }

    .menor-preco-vazio {

      margin-top: 10px;

      border-radius: 14px;

      padding: 10px 12px;

      background: #f8fafc;

      border: 1px dashed #cbd5e1;

      font-size: 11px;

      font-weight: 800;

      color: #64748b;

    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div class="login" id="login">

    <div class="login-card">

      <div class="logo">

        <img
    src="logo-mercatto.png"
  >

      </div>

      <h1>Portal do Fornecedor</h1>

      <p>
        Acesse suas cotações para a empresa Mercatto Delícia
      </p>

      <input
      id="cnpj"
      placeholder="CNPJ"
    >

      <input
      id="senha"
      type="password"
      placeholder="Senha"
    >

      <button onclick="entrar()">
      Entrar
    </button>

    </div>

  </div>

  <!-- APP -->

  <div class="app" id="app">

    <div class="top">

      <div class="top-flex">

        <div>

          <h1 id="nomeFornecedor">
            Fornecedor
          </h1>

          <small id="infoFornecedor"></small>

        </div>

        <div class="top-actions">

          <button
          class="btn"
          onclick="carregarCotacoes()">

          Atualizar

        </button>

          <button
          class="btn btn-red"
          onclick="sair()">

          Sair

        </button>

        </div>

      </div>

    </div>

    <div class="container" id="listaCotacoes">
    </div>

  </div>

  <!-- OVERLAY -->

  <div class="overlay" id="overlay">

    Processando...

  </div>

  <script>
    const sb = supabase.createClient(
  "https://dxkszikemntfusfyrzos.supabase.co",
  "sb_publishable_NNFvdfSXgOdGGVcSbphbjQ_brC3_9ed"
);

let fornecedor = JSON.parse(
  localStorage.getItem("fornecedor_logado")
);

let ultimoEvento = 0;

let mapaFornecedores = {};

if(fornecedor){
  iniciar();
}
/* ================= LOGIN ================= */

async function entrar(){

  /* LIBERA ÁUDIO NO CLICK */

  const audio =
    document.getElementById(
      'somNotify'
    );

  try{

    audio.muted = true;

    await audio.play();

    audio.pause();

    audio.currentTime = 0;

    audio.muted = false;

    console.log(
      'Áudio liberado'
    );

  }catch(err){

    console.log(
      'Falha liberar áudio',
      err
    );

  }

  const cnpj = document
    .getElementById("cnpj")
    .value
    .replace(/\D/g,"");

  const senha = document
    .getElementById("senha")
    .value
    .trim();

  overlay(true);

  const { data } = await sb

    .from("fornecedores_mercatto")

    .select("*")
    .eq("ativo", true);

  overlay(false);

  const encontrado = (data || [])

    .find(f => {

      return (

        String(f.cnpj || "")
        .replace(/\D/g,"")

        === cnpj

        &&

        String(f.senha || "")
        .trim()

        === senha

      );

    });

  if(!encontrado){

    alert(
      "CNPJ ou senha inválidos"
    );

    return;
  }

  fornecedor = encontrado;

  localStorage.setItem(
    "fornecedor_logado",
    JSON.stringify(fornecedor)
  );

  iniciar();
}
/* ================= INICIAR ================= */

async function iniciar(){

  document.getElementById("login")
    .style.display = "none";

  document.getElementById("app")
    .style.display = "block";

  document.getElementById("nomeFornecedor")
    .innerText = fornecedor.nome;

  document.getElementById("infoFornecedor")
    .innerText = fornecedor.cnpj;

  await carregarMapaFornecedores();

  await carregarCotacoes();
}

/* ================= MAPA DE FORNECEDORES ================= */

async function carregarMapaFornecedores(){

  const { data, error } = await sb

    .from("fornecedores_mercatto")

    .select("id,nome,cnpj,contato");

  if(error){

    console.log(
      "Erro ao carregar fornecedores",
      error
    );

    mapaFornecedores = {};

    return;
  }

  mapaFornecedores = {};

  (data || []).forEach(f => {

    mapaFornecedores[f.id] = {

      id:f.id,

      nome:
        f.nome ||
        f.contato ||
        "Fornecedor",

      cnpj:
        f.cnpj || ""

    };

  });

}









  
/* ================= COTAÇÕES ================= */

async function carregarCotacoes(){

  overlay(true);

  const { data, error } = await sb

    .from("cotacoes")

    .select("*")

    .order(
      "data_cotacao",
      { ascending:false }
    );

  overlay(false);

  if(error){

    console.log(error);

    alert("Erro ao carregar");

    return;
  }

 const filtradas = (data || [])

  .filter(c => {

    /* NÃO MOSTRA FINALIZADAS */

    if(
      String(c.status || '')
      .toUpperCase() === 'FINALIZADA'
    ){
      return false;
    }

    const itens =
      c.itens_cotacao || [];

    return itens.some(i => {

      return (
        i.fornecedores || []
      ).some(f =>

        f.fornecedor_id === fornecedor.id

      );

    });

  });

  renderCotacoes(filtradas);
}

/* ================= RENDER ================= */

function renderCotacoes(cotacoes){

  const lista =
    document.getElementById(
      "listaCotacoes"
    );

  lista.innerHTML = "";

  if(!cotacoes.length){

    lista.innerHTML = `

      <div class="empty">

        Nenhuma cotação disponível

      </div>

    `;

    return;
  }

  cotacoes.forEach(c => {

    const itens =
      c.itens_cotacao || [];

    const bloqueada =
      c.status === "finalizada";

    lista.innerHTML += `

      <div class="card">

        <div class="card-top">

          <div>

            <h2>
              ${c.nome || "Cotação"}
            </h2>


          </div>

          <div class="
            status

            ${
              c.status === "finalizada"
              ? "finalizada"

              : c.status === "respondida"
              ? "respondida"

              : "ativa"
            }
          ">

            ${(c.status || "ativa")
              .toUpperCase()}

          </div>

        </div>

      <div class="cotacao-lista">

        ${itens.map((i,index)=>{

          const meuFornecedor =

            (i.fornecedores || [])

            .find(f =>

              f.fornecedor_id ===
              fornecedor.id

            );

          if(!meuFornecedor)
            return "";

          const key =
            "cot_"+c.id+"_"+index;

          const cache = JSON.parse(

            localStorage.getItem(key)

            || JSON.stringify({

              preco_unitario:
                meuFornecedor.preco_unitario || "",

              obs:
                meuFornecedor.observacao || ""

            })

          );

          return `

            <div class="item-cotacao">

              <div class="linha-topo">



<div class="produto">

  <span style="
    font-weight:900;
    color:#2563eb;
    margin-right:6px;
    text-transform:uppercase;
  ">
    ${i.unidade || "UN"}
  </span>

  ${i.produto}

</div>

              </div>

              <div class="linha-inputs">

                <input

                  type="text"

                  inputmode="decimal"

                  autocomplete="off"

                  class="
                    input
                    money
                    ${bloqueada ? "readonly" : ""}
                  "

                  placeholder="0,00"

                  value="${
                    cache.preco_unitario || ""
                  }"

                  ${bloqueada ? "readonly" : ""}

                  oninput="
                    formatarMoeda(
                      this,
                      '${key}'
                    )
                  "

                >

                <input

                  class="
                    input
                    ${bloqueada ? "readonly" : ""}
                  "

                  placeholder="Obs"

                  value="${
                    cache.obs || ""
                  }"

                  ${bloqueada ? "readonly" : ""}

                  oninput="
                    salvarLocal(
                      '${key}',
                      'obs',
                      this.value
                    )
                  "

                >

              </div>

            ${htmlMenorPrecoOutrosFornecedores(i, cache.preco_unitario)}

            </div>

          `;

        }).join("")}

      </div>
        <div class="actions">

          ${
            bloqueada

            ? `

              <div style="
                font-size:13px;
                font-weight:700;
                color:#dc2626;
              ">

                Cotação finalizada.
                Edição bloqueada.

              </div>

            `

            : `

              <button
                class="btn btn-light"
                onclick="limpar('${c.id}')">

                Limpar

              </button>

              <button
                class="btn"
                onclick="enviar('${c.id}')">

                Enviar Cotação

              </button>

            `
          }

        </div>

      </div>

    `;

  });

}



/* ================= MENOR PREÇO DOS OUTROS FORNECEDORES ================= */

function htmlMenorPrecoOutrosFornecedores(item, meuPrecoDigitado){

  const menor =
    calcularMenorPrecoOutrosFornecedores(item);

  const meuPreco =
    normalizarNumeroPreco(meuPrecoDigitado);

  if(!menor){

    return `

      <div class="menor-preco-vazio">

        Ainda não existe preço lançado por outro fornecedor.

      </div>

    `;

  }

  let statusTexto = "";
  let statusClasse = "";
  let diferencaTexto = "";
  let mostrarPrecoConcorrente = true;

  if(meuPreco > 0){

    const diferenca =
      Number((meuPreco - menor.preco).toFixed(2));

    if(meuPreco < menor.preco){

      statusTexto =
        "Você está ganhando";

      statusClasse =
        "ganhando";

      diferencaTexto =
        "";

      mostrarPrecoConcorrente =
        false;

    }else if(meuPreco > menor.preco){

      statusTexto =
        "Você está perdendo";

      statusClasse =
        "perdendo";

      diferencaTexto =
        "Seu preço está " +
        formatarReal(Math.abs(diferenca)) +
        " acima.";

      mostrarPrecoConcorrente =
        true;

    }else{

      statusTexto =
        "Você está empatado";

      statusClasse =
        "empatado";

      diferencaTexto =
        "Seu preço está igual ao menor concorrente.";

      mostrarPrecoConcorrente =
        true;

    }

  }else{

    statusTexto =
      "Informe seu preço para comparar";

    statusClasse =
      "sem-preco";

    diferencaTexto =
      "Depois de digitar, o sistema mostra se você está ganhando ou perdendo.";

    mostrarPrecoConcorrente =
      true;

  }

  return `

    <div class="menor-preco-box">

      <div class="menor-preco-info">

        <div class="menor-preco-label">

          Comparação com outros fornecedores

        </div>

        ${
          mostrarPrecoConcorrente
          ? `

            <div class="menor-preco-fornecedor">

              ${escaparHtml(menor.nomeFornecedor)}

            </div>

          `
          : `

            <div class="menor-preco-fornecedor">

              Você está com o melhor preço até agora

            </div>

          `
        }

        <div class="comparacao-preco ${statusClasse}">

          ${statusTexto}

        </div>

        <div class="comparacao-diferenca">

          ${diferencaTexto}

        </div>

      </div>

      ${
        mostrarPrecoConcorrente
        ? `

          <div class="menor-preco-valor">

            ${formatarReal(menor.preco)}

          </div>

        `
        : `

          <div class="menor-preco-valor melhor-preco">

            Melhor preço

          </div>

        `
      }

    </div>

  `;

}
function calcularMenorPrecoOutrosFornecedores(item){

  const fornecedores =
    item.fornecedores || [];

  const outrosComPreco = fornecedores

    .filter(f => {

      if(
        String(f.fornecedor_id) ===
        String(fornecedor.id)
      ){
        return false;
      }

      const preco =
        normalizarNumeroPreco(
          f.preco_unitario
        );

      return preco > 0;

    })

    .map(f => {

      const fornecedorCadastro =
        mapaFornecedores[
          f.fornecedor_id
        ] || {};

      const nomeFornecedor =

        f.fornecedor_nome ||

        f.nome_fornecedor ||

        f.nome ||

        f.razao_social ||

        fornecedorCadastro.nome ||

        "Fornecedor não identificado";

      return {

        fornecedor_id:
          f.fornecedor_id,

        nomeFornecedor:
          nomeFornecedor,

        preco:
          normalizarNumeroPreco(
            f.preco_unitario
          )

      };

    })

    .sort((a,b) => {

      return a.preco - b.preco;

    });

  return outrosComPreco[0] || null;

}

function normalizarNumeroPreco(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return 0;
  }

  if(typeof valor === "number"){

    return Number(valor) || 0;

  }

  return Number(

    String(valor)

      .replace(/\s/g,"")

      .replace(/\./g,"")

      .replace(",",".")

  ) || 0;

}

function formatarReal(valor){

  return Number(valor || 0)

    .toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    );

}

function escaparHtml(texto){

  return String(texto || "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}












  
/* ================= LOCAL ================= */

function salvarLocal(
  key,
  campo,
  valor
){

  let obj = JSON.parse(
    localStorage.getItem(key)
    || "{}"
  );

  obj[campo] = valor;

  localStorage.setItem(
    key,
    JSON.stringify(obj)
  );

}

/* ================= ENVIAR ================= */

async function enviar(cotacaoId){

  overlay(true);

  const { data } = await sb

    .from("cotacoes")

    .select("*")

    .eq("id", cotacaoId)

    .single();

  let itens =
    data.itens_cotacao || [];

  for(let i=0; i<itens.length; i++){

    const item = itens[i];

    const fornecedorIndex =

      (item.fornecedores || [])

      .findIndex(f =>

        f.fornecedor_id ===
        fornecedor.id

      );

    if(fornecedorIndex === -1)
      continue;

    const key =
      "cot_"+cotacaoId+"_"+i;

    const cache = JSON.parse(
      localStorage.getItem(key)
      || "{}"
    );

if(
  !cache.preco_unitario
){
  continue;
}

const precoUnit = Number(

  String(
    cache.preco_unitario || '0'
  )

  .replace(/\s/g,'')
  .replace(/\./g,'')
  .replace(',','.')

) || 0;

/* QUANTIDADE EMBALAGEM */

const qtdEmbalagem = Number(

  item.qtd_unidades ||

  item.quantidade_embalagem ||

  1

);

/* QUANTIDADE SOLICITADA */

const qtdSolicitada = Number(
  item.qtd_solicitada || 0
);

/* PREÇO EMBALAGEM */

const precoEmbalagem = Number(

  (
    precoUnit *
    qtdEmbalagem
  ).toFixed(2)

);

/* TOTAL */

const precoTotal = Number(

  (
    precoEmbalagem *
    qtdSolicitada
  ).toFixed(2)

);

item.fornecedores[
  fornecedorIndex
] = {

  ...item.fornecedores[
    fornecedorIndex
  ],

  preco_unitario:
    precoUnit,

  quantidade_embalagem:
    qtdEmbalagem,

  preco_embalagem:
    precoEmbalagem,

  preco_total:
    precoTotal,

  observacao:
    cache.obs || "",

  respondido_em:
    new Date().toISOString()

};
    
  }

  await sb

    .from("cotacoes")

    .update({

      itens_cotacao:itens,
      atualizado_em:new Date(),
      status:"respondida"

    })

    .eq("id", cotacaoId);

  overlay(false);

  alert(
    "Cotação enviada com sucesso"
  );

  carregarCotacoes();
}

function formatarMoeda(el,key){

  let v = el.value || '';

  v = v.replace(/\D/g,'');

  if(!v){

    el.value = '';

    salvarLocal(
      key,
      'preco_unitario',
      ''
    );

    return;
  }

  v = (
    Number(v) / 100
  ).toLocaleString(
    'pt-BR',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

  el.value = v;

  salvarLocal(
    key,
    'preco_unitario',
    v
  );

}

async function liberarAudio(){

  const audio =
    document.getElementById(
      'somNotify'
    );

  try{

    audio.volume = 0;

    await audio.play();

    audio.pause();

    audio.volume = 1;

    audioLiberado = true;

    console.log(
      'Áudio liberado'
    );

  }catch(err){

    );

  }
